<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PetMTY</title>
<meta name="theme-color" content="#0DC0E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PetMTY">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0DC0E0; --azul-osc:#0A9FBA; --amarillo:#F6F28F; --amarillo-osc:#D9D45E; --tinta:#2F4A57;
  --fondo:#F2F8FA; --hoja:#FFFFFF; --texto:#22343D; --suave:#5F7682; --linea:#E1ECF0; --circulo:#E6F8FC;
  --rojo:#E5484D; --verde:#25D366;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fondo:#0F1A20;--hoja:#17262E;--texto:#E8F2F5;--suave:#A6BCC5;--linea:#26373F;--circulo:#1E3540;color-scheme:dark}}
:root[data-theme="dark"]{--fondo:#0F1A20;--hoja:#17262E;--texto:#E8F2F5;--suave:#A6BCC5;--linea:#26373F;--circulo:#1E3540;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fondo);color:var(--texto);font-family:"Fredoka","Arial Rounded MT Bold","Varela Round",system-ui,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--azul);outline-offset:3px}

/* Estructura */
.app{min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.cab{position:sticky;top:0;z-index:10;background:var(--azul);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 14px;display:flex;align-items:center;gap:12px}
.cab img{width:44px;height:44px}
.cab h1{margin:0;font-size:1.35rem;font-weight:700;flex:1}
.cab .atras{border:0;background:rgba(255,255,255,.22);color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.3rem;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--hoja);border-top:1px solid var(--linea);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .pata{position:absolute;top:2px;left:50%;margin-left:5px;width:20px;height:20px;border-radius:50%;background:var(--rojo);border:2px solid var(--hoja);display:flex;align-items:center;justify-content:center;animation:latir 1.6s ease-in-out infinite}
.nav .pata svg{width:12px;height:12px;fill:#fff}
.nuevo{display:inline-block;background:#FCEBEB;color:#A32D2D;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:middle}
.nav button{position:relative;flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--suave);font-size:.75rem;font-weight:500;cursor:pointer;border-radius:12px}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--azul-osc)}
.nav .centro{position:relative;top:-18px}
.nav .centro span.bola{width:62px;height:62px;border-radius:50%;background:var(--azul);display:grid;place-items:center;box-shadow:0 5px 0 var(--azul-osc),0 8px 18px rgba(0,0,0,.15)}
.nav .centro span.bola img{width:52px;height:auto;margin-top:-2px}
.nav .centro small{margin-top:4px;color:var(--texto);font-weight:600}

/* Piezas */
.tarjeta{background:var(--hoja);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(20,60,75,.06)}
.tarjeta h2{margin:0 0 10px;font-size:1.2rem}
.hola{margin:4px 0 14px}
.hola h2{margin:0;font-size:1.7rem;line-height:1.1}
.hola p{margin:4px 0 0;color:var(--suave)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;padding:15px 18px;font-size:1.1rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn.prim{background:var(--amarillo);color:var(--tinta);box-shadow:0 5px 0 var(--amarillo-osc)}
.btn.prim:active{transform:translateY(3px);box-shadow:0 2px 0 var(--amarillo-osc)}
.btn.azul{background:var(--azul);color:#fff;box-shadow:0 5px 0 var(--azul-osc)}
.btn.wa{background:var(--verde);color:#fff;box-shadow:0 5px 0 #1A9E4C}
.btn.claro{background:var(--circulo);color:var(--texto)}
.btn.negro{background:#111;color:#fff}
.btn.blanco{background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.btn.peligro{background:none;color:var(--rojo);border:1px solid var(--rojo)}
.btn svg{width:22px;height:22px;flex:0 0 auto}
.btn+.btn{margin-top:12px}
.rapidos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.rapido{border:0;background:var(--hoja);border-radius:20px;padding:14px;text-align:left;cursor:pointer;box-shadow:0 2px 10px rgba(20,60,75,.06)}
.rapido b{display:block;font-size:1.05rem;margin-top:6px}
.rapido span{color:var(--suave);font-size:.9rem}
.rapido .em{font-size:1.7rem}
.fila{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.av{flex:0 0 56px;width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--circulo);display:grid;place-items:center;font-size:1.8rem;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.fila .txt{flex:1;min-width:0}
.fila .txt b{display:block;font-size:1.08rem}
.fila .txt span{color:var(--suave);font-size:.92rem}
.chip{display:inline-block;background:var(--circulo);color:var(--texto);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:500;margin:2px 4px 0 0}
.chip.rojo{background:#FDE2E3;color:#B42328}
.muted{color:var(--suave)}
.vacio{text-align:center;padding:16px 6px;color:var(--suave)}
.vacio .em{font-size:2.4rem}

/* Formularios */
label{display:block;font-weight:600;margin:14px 0 6px}
label small{font-weight:400;color:var(--suave)}
input[type=text],input[type=tel],input[type=email],input[type=datetime-local],input[type=date],select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--linea);background:var(--hoja);font-size:1rem}
textarea{min-height:80px;resize:vertical}
input[type=datetime-local],input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:52px;text-align:left}
input::-webkit-date-and-time-value{text-align:left;margin:0}
input::-webkit-datetime-edit{padding:0}
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.opciones button{border:1.5px solid var(--linea);background:var(--hoja);border-radius:999px;padding:9px 14px;font-weight:500;cursor:pointer}
.opciones button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.foto-sel{display:flex;align-items:center;gap:14px}
.foto-sel .av{flex-basis:84px;width:84px;height:84px}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.interruptor input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:var(--linea);position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}
.interruptor input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.interruptor input:checked{background:var(--verde)}
.interruptor input:checked::after{transform:translateX(22px)}

/* Bienvenida */
.bienv{min-height:100vh;min-height:100dvh;background:var(--azul);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(30px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px))}
.bienv img.perro{width:170px;height:auto;margin-bottom:6px}
.bienv h1{margin:0;font-size:2.4rem;font-weight:700}
.bienv p{margin:6px 0 26px;font-size:1.15rem;font-weight:500;max-width:28ch}
.bienv .botones{width:100%;max-width:360px}
.bienv .nota{margin-top:16px;font-size:.85rem;opacity:.85}
.paso{max-width:480px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(30px + env(safe-area-inset-bottom,0px))}
.paso h1{font-size:1.8rem;margin:10px 0 4px;line-height:1.1}
.paso .muted{margin:0 0 6px}
.puntos{display:flex;gap:6px;margin-bottom:6px}
.puntos i{width:28px;height:6px;border-radius:3px;background:var(--linea)}
.puntos i.on{background:var(--azul)}
.lista-mun{display:grid;gap:8px;margin-top:10px}
.lista-mun button{border:1.5px solid var(--linea);background:var(--hoja);border-radius:16px;padding:13px 14px;text-align:left;font-weight:500;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.lista-mun button.on{border-color:var(--azul);background:var(--circulo)}
.lista-mun button.on::after{content:"✓";color:var(--azul-osc);font-weight:700}

.aviso{background:#FFF7D6;color:#5C4A00;border-radius:16px;padding:12px 14px;font-size:.92rem;margin-top:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .aviso{background:#3A3317;color:#F3E7B2}}
.alerta-card{display:flex;gap:12px;align-items:center;background:#FFF1F1;border-radius:18px;padding:12px;margin-bottom:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .alerta-card{background:#3A2224}}
.alerta-card .av{background:#fff}
.promos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -4px 4px;padding:2px 4px 6px;scrollbar-width:none}
.promos::-webkit-scrollbar{display:none}
.promo{flex:0 0 82%;scroll-snap-align:start;background:var(--amarillo);color:#2F4A57;border-radius:20px;padding:14px;position:relative;cursor:pointer;text-align:left;border:0;font:inherit}
.promo:only-child{flex-basis:100%}
.promo .neg{display:flex;align-items:center;gap:8px;font-size:.88rem;margin-bottom:6px}
.promo .logo{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;overflow:hidden;flex:0 0 auto}
.promo .logo img{width:100%;height:100%;object-fit:cover}
.promo .of{font-size:1.45rem;font-weight:700;line-height:1.15;margin:0}
.promo .vig{font-size:.82rem;opacity:.8;margin:4px 0 10px}
.promo .ver{background:#2F4A57;color:#fff;border-radius:999px;padding:8px;text-align:center;font-weight:600;font-size:.92rem}
.promo .tag{position:absolute;top:12px;right:12px;background:var(--rojo);color:#fff;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px}
.cupon{background:var(--hoja);border-radius:22px;overflow:hidden;margin-bottom:12px}
.cupon .arriba{background:var(--amarillo);color:#2F4A57;text-align:center;padding:18px 16px}
.cupon .arriba .logo{width:64px;height:64px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem;overflow:hidden;margin-bottom:6px}
.cupon .arriba .logo img{width:100%;height:100%;object-fit:cover}
.cupon .abajo{border-top:2px dashed var(--linea);padding:16px;text-align:center}
.cupon .codigo{border:2px dashed var(--azul);border-radius:14px;padding:10px;font-size:1.6rem;font-weight:700;letter-spacing:3px;margin:6px 0 12px;cursor:pointer}
.cup-pedido{display:flex;align-items:center;gap:10px;background:var(--amarillo);color:#2F4A57;border-radius:16px;padding:12px 14px;margin-top:16px}
.cup-pedido b{flex:1}
.cup-pedido button{border:0;background:rgba(47,74,87,.12);color:#2F4A57;width:30px;height:30px;border-radius:50%;font-size:1rem;cursor:pointer}
.tag.env{background:#2F4A57}
.promo-vacio{display:flex;gap:12px;align-items:center;cursor:pointer}
.promo-vacio .em{font-size:2rem}
.alerta-card{cursor:pointer}
.prod{padding:0;overflow:hidden}
.prod img{width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in}
.prod .info{padding:16px}
.prod h2{margin:0;font-size:1.35rem}
.prod .precio{display:inline-block;margin:6px 0 10px;background:var(--amarillo);color:var(--tinta);font-weight:700;font-size:1.2rem;padding:3px 14px;border-radius:999px}
.prod ul{list-style:none;margin:0 0 16px;padding:0}
.prod li{padding:3px 0}
.alerta-card .ver{display:block;margin-top:4px;font-size:.86rem;font-weight:600;color:var(--azul-osc)}
.galeria{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:22px;background:#000;scrollbar-width:none;margin-bottom:8px}
.galeria::-webkit-scrollbar{display:none}
.galeria img{flex:0 0 100%;width:100%;height:min(105vw,440px);object-fit:cover;scroll-snap-align:center;cursor:zoom-in}
.galeria .sinfoto{flex:0 0 100%;height:240px;display:grid;place-items:center;font-size:6rem;background:var(--circulo)}
.puntos-gal{display:flex;justify-content:center;gap:6px;margin:4px 0 2px}
.puntos-gal i{width:8px;height:8px;border-radius:4px;background:var(--linea);transition:width .2s}
.puntos-gal i.on{background:var(--azul);width:22px}
.pie{text-align:center;font-size:.9rem;margin:4px 0 12px}
.datos{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.datos dt{color:var(--suave)}
.datos dd{margin:0;font-weight:500}
.caduca{display:flex;gap:10px;align-items:flex-start;background:var(--circulo);border-radius:16px;padding:12px 14px;font-size:.93rem;margin-top:18px}
.visor{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.visor img{max-width:100%;max-height:100%;object-fit:contain}
.visor button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:1.4rem;cursor:pointer}
.especial-cab{display:flex;align-items:center;gap:14px}
.especial-ico{flex:0 0 auto;width:60px;height:60px;border-radius:50%;background:#FDE7EF;display:grid;place-items:center;font-size:1.8rem}
.especial-cab b{display:block;font-size:1.35rem;font-weight:700;line-height:1.15}
.etiqueta{display:inline-block;margin-top:4px;background:var(--amarillo);color:var(--tinta);font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px}
.especial-txt{margin:14px 0 10px;color:var(--suave);font-size:1.05rem}
.especial-lista{list-style:none;margin:0 0 20px;padding:0}
.especial-lista li{padding:6px 0;font-size:1.03rem}
.lovi{display:block;width:fit-content;margin-top:10px;border:0;background:var(--azul);color:#fff;font-weight:600;font-size:.92rem;padding:7px 14px;border-radius:999px;cursor:pointer}
.lovi:disabled{opacity:.7}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:999px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.av-capa{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column}
.av-completa{background:var(--azul);color:#fff;align-items:center;justify-content:center;padding:calc(30px + env(safe-area-inset-top,0px)) 26px calc(26px + env(safe-area-inset-bottom,0px));text-align:center}
.av-completa .av-cont{max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;flex:1}
.av-fondo{background:rgba(10,25,32,.5);justify-content:flex-end}
.av-hoja{background:var(--hoja);color:var(--texto);border-radius:24px 24px 0 0;padding:16px 22px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;animation:subir .25s ease-out}
@keyframes subir{from{transform:translateY(100%)}to{transform:none}}
.av-asa{width:40px;height:4px;border-radius:2px;background:var(--linea);margin:0 auto 14px}
.av-ico{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;position:relative;margin:0 auto 18px}
.av-ico img{width:84px;height:84px;object-fit:contain}
.av-ico .camp{position:absolute;right:-12px;top:-8px;width:44px;height:44px;border-radius:50%;background:var(--amarillo);display:flex;align-items:center;justify-content:center;font-size:24px;animation:sonar 1.4s ease-in-out infinite}
@keyframes sonar{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-14deg)}}
.av-hoja .av-ico{width:76px;height:76px;background:var(--circulo)}
.av-hoja .av-ico img{width:54px;height:54px}
.av-hoja .av-ico .camp{width:32px;height:32px;font-size:17px}
.av-tit{font-size:1.7rem;font-weight:700;margin:0 0 10px}
.av-hoja .av-tit{font-size:1.3rem}
.av-txt{margin:0 0 8px;line-height:1.5}
.av-no{background:none;border:0;color:inherit;opacity:.9;text-decoration:underline;font:inherit;padding:10px;cursor:pointer;margin-top:4px}
.av-demo{background:#fff;color:#22343D;border-radius:18px;padding:16px;margin:16px auto 6px;max-width:280px;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.av-demo p{margin:0 0 12px;font-size:.95rem}
.av-demo .bts{display:flex;justify-content:flex-end;gap:18px;font-weight:600;font-size:.95rem}
.av-demo .si{color:#0A6CD1;border:3px solid #F6C543;border-radius:10px;padding:2px 8px;animation:latir 1.2s ease-in-out infinite}
@keyframes latir{50%{transform:scale(1.08)}}
.av-hoja .av-demo{background:var(--fondo);color:var(--texto);box-shadow:none}
</style>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
<div id="raiz"></div>
<div id="toast" role="status"></div>

function galMover(el){

function verFoto(k,i){

function compartir(k){
  const a=ALERTAS[k];
  const t=`🐾 ¡Ayúdanos a encontrar a ${a.nombre}!\nSe perdió en ${a.colonia}, ${a.municipio}.\n${a.desc}\n\nSi lo ves, avisa a PetMTY por WhatsApp: https://wa.me/${WA_NUM}`;
  const datos={title:"Se perdió "+a.nombre,text:t};
  try{
    if(a.fotos.length){
      const b64=a.fotos[0].split(",")[1], bin=atob(b64), u8=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
      const f=new File([u8],a.nombre+".jpg",{type:"image/jpeg"});
      if(navigator.canShare&&navigator.canShare({files:[f]})) datos.files=[f];
    }
  }catch(e){}
  if(navigator.share) navigator.share(datos).catch(()=>{});
  else location.href="https://wa.me/?text="+encodeURIComponent(t);
}

function loVi(k,btn){
  const a=ALERTAS[k]; if(!a) return;
  const base=`🐾 Hola, creo que vi a ${a.nombre} (${a.tipo==="gato"?"gato":"perro"} que se perdió en ${a.colonia}, ${a.municipio}).`;
  const abrir=t=>{ btn.disabled=false; btn.textContent="🐾 ¡Lo vi, quiero ayudar!"; location.href=wa(t); };
  if(!navigator.geolocation) return abrir(base+"\n📍 Lo vi en: ");
  btn.disabled=true; btn.textContent="Buscando tu ubicación…";
  navigator.geolocation.getCurrentPosition(
    p=>abrir(base+`\n📍 Lo vi aquí: https://maps.google.com/?q=${p.coords.latitude.toFixed(5)},${p.coords.longitude.toFixed(5)}`),
    ()=>abrir(base+"\n📍 Lo vi en: "),
    {enableHighAccuracy:true,timeout:8000});
}

function opc(campo,vals){ return `<div class="opciones">${vals.map(v=>`<button type="button" class="${temp[campo]===v?"on":""}" onclick="leerForm();temp['${campo}']='${v}';render()">${v}</button>`).join("")}</div>`; }
function formMascota(){
  return `<div class="tarjeta">
    <div class="foto-sel"><div class="av">${temp.foto?`<img src="${temp.foto}" alt="">`:emo(temp.tipo)}</div>
      <div><button class="btn claro" style="padding:10px 16px;width:auto" onclick="$('#fFoto').click()">📷 ${temp.foto?"Cambiar foto":"Agregar foto"}</button>

    <label for="fNom">Nombre</label><input id="fNom" type="text" value="${esc(temp.nombre)}" placeholder="Ej. Max">

    <label>Tamaño</label>${opc("tamano",["chico","mediano","grande","gigante"])}

function leerForm(){ if(!$("#fNom"))return; temp.nombre=$("#fNom").value; temp.caracter=$("#fCar").value; temp.vacunas=$("#fVac").value; temp.notas=$("#fNot").value; }
function cargarFoto(inp){
  const f=inp.files[0]; if(!f)return; leerForm();
  const img=new Image(); img.onload=()=>{ const s=420, c=document.createElement("canvas"), k=Math.min(1,s/Math.max(img.width,img.height));
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    temp.foto=c.toDataURL("image/jpeg",.8); URL.revokeObjectURL(img.src); render(); };
  img.src=URL.createObjectURL(f);
}
function guardarMascota(){
  leerForm(); if(!temp.nombre.trim()) return toast("Escribe su nombre");

/* ---------- Promos y cupones ---------- */
function cuponVivo(c){
  const now = Date.now();
  if(c.vence && now >= Date.parse(c.vence + "T23:59:59")) return false;
  if(c.hasta && now >= Date.parse(c.hasta)) return false;
  if(c.duraMin){ const t = ((S.vistos||{}).cuponT||{})[c.id]; if(t && now - t > c.duraMin*6e4) return false; }
  return true;
}
/* Orden: nuevos sin ver → de su municipio → resto; el de bienvenida ya enviado va al final */

const cuponesVigentes = () => CUPONES.filter(cuponVivo).sort((a,b) => pesoCupon(a) - pesoCupon(b));

  if(!S.usuario) return; const v = vistos(); v.cuponT = v.cuponT || {}; let cambio = false;

    <div class="abajo">${c.codigo?`<p class="muted" style="margin:0">${c.propio?"Tu código":"Muestra este código en el negocio"}</p><div class="codigo" onclick="copiarCodigo('${esc(c.codigo)}')" title="Tocar para copiar">${esc(c.codigo)}</div>`:""}
    <p class="muted" style="margin:0;line-height:1.6">${c.direccion?"📍 "+esc(c.direccion)+"<br>":""}${c.vence?"📅 Válido hasta el "+new Date(c.vence+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"long"})+"<br>":""}${c.condiciones?esc(c.condiciones):""}</p></div></div>
    ${c.propio ? `${S.bienvenida&&S.bienvenida.enviado?`<div class="caduca" style="margin:0 0 12px"><span>✓</span><span><b>Ya lo enviaste en una cotización.</b> Si al final no viajas, puedes usarlo en tu próximo traslado.</span></div>`:""}<button class="btn prim" onclick="usarCupon(${sub})">🚐 Usarlo en mi traslado</button>` : `${c.whatsapp?`<a class="btn wa" href="https://wa.me/${esc(c.whatsapp)}?text=${encodeURIComponent("Hola, vengo de PetMTY 🐾 y quiero usar el cupón "+(c.codigo||c.oferta))}">${ICO.wa} Agendar con ${esc(c.negocio)}</a>`:""}
    <button class="btn claro" onclick="llevarA(${sub})">🚐 Te llevamos con PetMTY</button>`}`;
}
let DESTINO_PEND = "";
function llevarA(k){ const c = CUPONES[k]; DESTINO_PEND = c.direccion ? c.negocio + ", " + c.direccion : c.negocio; ir("pedir"); }
function copiarCodigo(t){ try{ navigator.clipboard.writeText(t); toast("Código copiado 📋"); }catch(e){} }
/* Cupón de bienvenida de PetMTY: 10% en el primer traslado, 30 días desde el registro
   (o desde que lo ve por primera vez quien ya tenía la app). Se usa al cotizar; se quita al vencer. */
const BIENVENIDA = {id:"bienvenido10", propio:true, negocio:"PetMTY", oferta:"10% en tu primer traslado", codigo:"BIENVENIDO10", icono:"🎁",
  condiciones:"Válido en tu primer traslado con PetMTY. Se aplica al cotizar por WhatsApp. Un cupón por persona."};
function asegurarBienvenida(){
  if(!S.usuario) return;
  if(!S.bienvenida){ S.bienvenida = {inicio: Date.now(), enviado:false}; guardar(); }
  const f = new Date(S.bienvenida.inicio + 30*864e5);
  BIENVENIDA.vence = f.getFullYear() + "-" + String(f.getMonth()+1).padStart(2,"0") + "-" + String(f.getDate()).padStart(2,"0");
  if(!CUPONES.includes(BIENVENIDA)) CUPONES.unshift(BIENVENIDA);
}
let CUPON_PEND = "";
function usarCupon(k){ CUPON_PEND = CUPONES[k].codigo; ir("pedir"); }

/* Hoja "¡Tienes un cupón nuevo!" una sola vez por cupón al abrir la app */
let PROMO = null;
function revisarCupones(){
  if(!S.usuario || PREG || PROMO) return;
  const c = cuponesVigentes().find(x => !cuponVisto(x)); if(!c) return;
  marcarCupon(c); PROMO = CUPONES.indexOf(c); render();
}
function htmlPromo(){
  if(PROMO === null) return "";
  const c = CUPONES[PROMO];
  return `<div class="av-capa av-fondo" role="dialog" aria-modal="true" onclick="if(event.target===this){PROMO=null;render()}"><div class="av-hoja"><div class="av-asa"></div>
    <div class="av-ico" style="background:var(--amarillo)"><span style="font-size:2.2rem">${c.icono||"🎁"}</span></div>
    <p class="av-tit">${c.propio?"¡Tienes un regalo de bienvenida!":"¡Tienes un cupón nuevo!"}</p><p class="av-txt"><b>${esc(c.oferta)}</b>${c.propio?"":" en "+esc(c.negocio)}${c.vence?" · Vence "+fechaCorta(c.vence):""}</p>
    <div style="height:8px"></div><button class="btn azul" onclick="const k=PROMO;PROMO=null;verCupon(k)">Ver cupón</button><button class="av-no" onclick="PROMO=null;render()">Ahora no</button></div></div>`;
}

/* ---------- Productos nuevos (patita roja) ---------- */
const PATA = '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="5" ry="4.3"/><circle cx="5.5" cy="10" r="2.2"/><circle cx="9.5" cy="6" r="2.3"/><circle cx="14.5" cy="6" r="2.3"/><circle cx="18.5" cy="10" r="2.2"/></svg>';
function vistos(){
  if(!S.vistos){ S.vistos = {tienda: PRODUCTOS.map(p => p.id), cupones: CUPONES.map(c => c.id)}; guardar(); }
  return S.vistos;
}
const hayNuevos = () => S.usuario && PRODUCTOS.some(p => !vistos().tienda.includes(p.id));
const esNuevo = p => p.fecha && Date.now() - Date.parse(p.fecha) < 7*864e5;
function marcarTiendaVista(){ const v = vistos(); PRODUCTOS.forEach(p => { if(!v.tienda.includes(p.id)) v.tienda.push(p.id); }); guardar(); }

/* ---------- Pregunta amable antes del permiso del celular ---------- */
/* PREG = {modo:"completa"|"hoja", estado:"pregunta"|"esperando"|"listo"|"no"|"bloqueado", ctx} */
let PREG = null;
const DIAS_ENTRE = 3, MAX_PREGUNTAS = 3;
function av(){ if(!S.avisos) S.avisos = {pregunto:0, ultimo:0, viaje:false}; return S.avisos; }
function puedePreguntar(){
  leerPermiso();
  const a = av();
  return S.usuario && AV.soportado && !AV.permiso && !AV.bloqueado && a.pregunto < MAX_PREGUNTAS && (a.pregunto === 0 || Date.now() - a.ultimo > DIAS_ENTRE*864e5);
}
function preguntar(modo, ctx){
  if(PREG || !puedePreguntar()) return false;
  const a = av(); a.pregunto++; a.ultimo = Date.now(); guardar();
  PREG = {modo, estado:"pregunta", ctx}; render(); return true;
}
function pedirPermiso(modo){
  leerPermiso();
  if(AV.permiso){ toast("Tus avisos ya están activados 🔔"); return; }
  if(!AV.soportado){ toast("Tu celular no permite avisos desde aquí"); return; }
  if(AV.bloqueado){ PREG = {modo:modo||"hoja", estado:"bloqueado"}; render(); return; }
  let prom; try{ prom = Notification.requestPermission(); }catch(e){}
  PREG = Object.assign(PREG || {modo:modo||"hoja"}, {estado:"esperando"}); render();
  Promise.resolve(prom).then(() => {
    leerPermiso();
    if(AV.permiso){ S.usuario.alertas = true; guardar(); sincronizarAvisos(); PREG.estado = "listo"; render(); setTimeout(() => { if(PREG && PREG.estado === "listo"){ PREG = null; render(); setTimeout(revisarCupones, 400); } }, 1800); }
    else if(AV.bloqueado){ PREG.estado = "bloqueado"; render(); }
    else { PREG.estado = "no"; render(); }
  });
}
function cerrarPreg(){ PREG = null; render(); setTimeout(revisarCupones, 400); }
function htmlPreg(){
  if(!PREG) return "";
  const u = S.usuario, m = esc(u.municipio), comp = PREG.modo === "completa";
  const ico = `<div class="av-ico"><img src="${PERRO}" alt=""><span class="camp">🔔</span></div>`;
  const btn = (t, f, cls) => `<button class="btn ${cls||(comp?"prim":"azul")}" onclick="${f}">${t}</button>`;
  let c = "";
  if(PREG.estado === "pregunta"){
    const tit = PREG.ctx === "viaje" ? "¡Gracias por viajar con nosotros!" : PREG.ctx === "alertas" ? "¿Te avisamos al momento?" : "¿Te avisamos?";
    const txt = PREG.ctx === "viaje"
      ? `¿Quieres que te avisemos de promociones y de mascotas perdidas en ${m}?`
      : `Si se pierde una mascota en <b>${m}</b>, te enteras al momento y puedes ayudar a encontrarla.`;
    c = `${ico}<p class="av-tit">${tit}</p><p class="av-txt">${txt}</p>${PREG.ctx==="viaje"?"":`<p class="av-txt" style="opacity:.85;font-size:.95rem">También te avisamos de promociones.</p>`}
      ${comp?'<div style="flex:1"></div>':'<div style="height:10px"></div>'}${btn("Sí, quiero avisos","pedirPermiso()")}<button class="av-no" onclick="cerrarPreg()">Ahora no</button>`;
  } else if(PREG.estado === "esperando"){
    c = `<p class="av-tit">Último paso 👇</p><p class="av-txt">Tu celular te va a preguntar. Toca <b>Permitir</b> para recibir los avisos.</p>
      <div class="av-demo"><p>¿Permitir que <b>PetMTY</b> te envíe notificaciones?</p><div class="bts"><span style="opacity:.6">No permitir</span><span class="si">Permitir</span></div></div>
      <p class="av-txt" style="font-size:.9rem;opacity:.85">El aviso puede salir arriba o en medio de la pantalla.</p>
      ${comp?'<div style="flex:1"></div>':''}<button class="av-no" onclick="pedirPermiso()">No me apareció nada</button><button class="av-no" onclick="cerrarPreg()">Ahora no</button>`;
  } else if(PREG.estado === "listo"){
    c = `${ico}<p class="av-tit">¡Listo! 🎉</p><p class="av-txt">Te avisaremos si se pierde una mascota en ${m}.</p>`;
  } else if(PREG.estado === "no"){
    c = `${ico}<p class="av-tit">No se activaron</p><p class="av-txt">No pasa nada. Puedes activarlos cuando quieras desde <b>Inicio</b> o <b>Perfil</b>.</p>${comp?'<div style="flex:1"></div>':''}${btn("Entendido","cerrarPreg()")}`;
  } else {
    c = `${ico}<p class="av-tit">Tus avisos están apagados</p><p class="av-txt">Para activarlos ve a los <b>Ajustes</b> de tu celular → <b>Apps</b> → <b>PetMTY</b> → <b>Notificaciones</b>.</p>${comp?'<div style="flex:1"></div>':''}${btn("Entendido","cerrarPreg()")}`;
  }
  return comp
    ? `<div class="av-capa av-completa" role="dialog" aria-modal="true"><div class="av-cont">${c}</div></div>`
    : `<div class="av-capa av-fondo" role="dialog" aria-modal="true" onclick="if(event.target===this)cerrarPreg()"><div class="av-hoja"><div class="av-asa"></div>${c}</div></div>`;
}
/* Recordatorio al volver a la app después de pedir un traslado */
function revisarViaje(){ if(S.usuario && av().viaje){ av().viaje = false; guardar(); preguntar("hoja","viaje"); } }
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ relojCupones(); if(vista==="inicio"||vista==="cupones") render(); setTimeout(revisarViaje, 600); setTimeout(revisarCupones, 900); } });

/* ---------- Enlaces directos (para notificaciones): petmty.mx/app/#tienda, #alerta-rocky ---------- */
function slug(t){ return String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function abrirEnlace(){
  const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  if(!h || !S.usuario) return false;
  history.replaceState(null, "", location.pathname + location.search);
  if(h.startsWith("cupon-")){
    const k = CUPONES.findIndex(c => c.id === h.slice(6));
    if(k >= 0){ desde = "cupones"; verCupon(k); return true; }
    ir("cupones"); return true;
  }
  if(h.startsWith("alerta-")){
    const k = ALERTAS.findIndex(a => (a.id || slug(a.nombre)) === h.slice(7));
    if(k >= 0){ desde = "alertas"; vista = "alerta"; sub = k; temp = {}; render(); window.scrollTo(0,0); return true; }
    ir("alertas"); return true;
  }
  if(TITULOS[h] && h !== "alerta" && h !== "cupon"){ ir(h); return true; }
  return false;
}
window.addEventListener("hashchange", abrirEnlace);
asegurarBienvenida(); relojCupones();
if(!abrirEnlace()) render();
setTimeout(revisarViaje, 800);
setTimeout(revisarCupones, 1200);
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
