<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PetMTY</title>
<meta name="theme-color" content="#0DC0E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PetMTY">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0DC0E0; --azul-osc:#0A9FBA; --amarillo:#F6F28F; --amarillo-osc:#D9D45E; --tinta:#2F4A57;
  --fondo:#F2F8FA; --hoja:#FFFFFF; --texto:#22343D; --suave:#5F7682; --linea:#E1ECF0; --circulo:#E6F8FC;
  --rojo:#E5484D; --verde:#25D366;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fondo:#0F1A20;--hoja:#17262E;--texto:#E8F2F5;--suave:#A6BCC5;--linea:#26373F;--circulo:#1E3540;color-scheme:dark}}
:root[data-theme="dark"]{--fondo:#0F1A20;--hoja:#17262E;--texto:#E8F2F5;--suave:#A6BCC5;--linea:#26373F;--circulo:#1E3540;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fondo);color:var(--texto);font-family:"Fredoka","Arial Rounded MT Bold","Varela Round",system-ui,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--azul);outline-offset:3px}

/* Estructura */
.app{min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.cab{position:sticky;top:0;z-index:10;background:var(--azul);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 14px;display:flex;align-items:center;gap:12px}
.cab img{width:44px;height:44px}
.cab h1{margin:0;font-size:1.35rem;font-weight:700;flex:1}
.cab .atras{border:0;background:rgba(255,255,255,.22);color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.3rem;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--hoja);border-top:1px solid var(--linea);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--suave);font-size:.75rem;font-weight:500;cursor:pointer;border-radius:12px}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--azul-osc)}
.nav .centro{position:relative;top:-18px}
.nav .centro span.bola{width:62px;height:62px;border-radius:50%;background:var(--azul);display:grid;place-items:center;box-shadow:0 5px 0 var(--azul-osc),0 8px 18px rgba(0,0,0,.15)}
.nav .centro span.bola img{width:52px;height:auto;margin-top:-2px}
.nav .centro small{margin-top:4px;color:var(--texto);font-weight:600}

/* Piezas */
.tarjeta{background:var(--hoja);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(20,60,75,.06)}
.tarjeta h2{margin:0 0 10px;font-size:1.2rem}
.hola{margin:4px 0 14px}
.hola h2{margin:0;font-size:1.7rem;line-height:1.1}
.hola p{margin:4px 0 0;color:var(--suave)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;padding:15px 18px;font-size:1.1rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn.prim{background:var(--amarillo);color:var(--tinta);box-shadow:0 5px 0 var(--amarillo-osc)}
.btn.prim:active{transform:translateY(3px);box-shadow:0 2px 0 var(--amarillo-osc)}
.btn.azul{background:var(--azul);color:#fff;box-shadow:0 5px 0 var(--azul-osc)}
.btn.wa{background:var(--verde);color:#fff;box-shadow:0 5px 0 #1A9E4C}
.btn.claro{background:var(--circulo);color:var(--texto)}
.btn.negro{background:#111;color:#fff}
.btn.blanco{background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.btn.peligro{background:none;color:var(--rojo);border:1px solid var(--rojo)}
.btn svg{width:22px;height:22px;flex:0 0 auto}
.btn+.btn{margin-top:12px}
.rapidos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.rapido{border:0;background:var(--hoja);border-radius:20px;padding:14px;text-align:left;cursor:pointer;box-shadow:0 2px 10px rgba(20,60,75,.06)}
.rapido b{display:block;font-size:1.05rem;margin-top:6px}
.rapido span{color:var(--suave);font-size:.9rem}
.rapido .em{font-size:1.7rem}
.fila{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.av{flex:0 0 56px;width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--circulo);display:grid;place-items:center;font-size:1.8rem;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.fila .txt{flex:1;min-width:0}
.fila .txt b{display:block;font-size:1.08rem}
.fila .txt span{color:var(--suave);font-size:.92rem}
.chip{display:inline-block;background:var(--circulo);color:var(--texto);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:500;margin:2px 4px 0 0}
.chip.rojo{background:#FDE2E3;color:#B42328}
.muted{color:var(--suave)}
.vacio{text-align:center;padding:16px 6px;color:var(--suave)}
.vacio .em{font-size:2.4rem}

/* Formularios */
label{display:block;font-weight:600;margin:14px 0 6px}
label small{font-weight:400;color:var(--suave)}
input[type=text],input[type=tel],input[type=email],input[type=datetime-local],input[type=date],select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--linea);background:var(--hoja);font-size:1rem}
textarea{min-height:80px;resize:vertical}
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.opciones button{border:1.5px solid var(--linea);background:var(--hoja);border-radius:999px;padding:9px 14px;font-weight:500;cursor:pointer}
.opciones button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.foto-sel{display:flex;align-items:center;gap:14px}
.foto-sel .av{flex-basis:84px;width:84px;height:84px}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.interruptor input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:var(--linea);position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}
.interruptor input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.interruptor input:checked{background:var(--verde)}
.interruptor input:checked::after{transform:translateX(22px)}

/* Bienvenida */
.bienv{min-height:100vh;min-height:100dvh;background:var(--azul);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(30px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px))}
.bienv img.perro{width:170px;height:auto;margin-bottom:6px}
.bienv h1{margin:0;font-size:2.4rem;font-weight:700}
.bienv p{margin:6px 0 26px;font-size:1.15rem;font-weight:500;max-width:28ch}
.bienv .botones{width:100%;max-width:360px}
.bienv .nota{margin-top:16px;font-size:.85rem;opacity:.85}
.paso{max-width:480px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(30px + env(safe-area-inset-bottom,0px))}
.paso h1{font-size:1.8rem;margin:10px 0 4px;line-height:1.1}
.paso .muted{margin:0 0 6px}
.puntos{display:flex;gap:6px;margin-bottom:6px}
.puntos i{width:28px;height:6px;border-radius:3px;background:var(--linea)}
.puntos i.on{background:var(--azul)}
.lista-mun{display:grid;gap:8px;margin-top:10px}
.lista-mun button{border:1.5px solid var(--linea);background:var(--hoja);border-radius:16px;padding:13px 14px;text-align:left;font-weight:500;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.lista-mun button.on{border-color:var(--azul);background:var(--circulo)}
.lista-mun button.on::after{content:"✓";color:var(--azul-osc);font-weight:700}

.aviso{background:#FFF7D6;color:#5C4A00;border-radius:16px;padding:12px 14px;font-size:.92rem;margin-top:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .aviso{background:#3A3317;color:#F3E7B2}}
.alerta-card{display:flex;gap:12px;align-items:center;background:#FFF1F1;border-radius:18px;padding:12px;margin-bottom:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .alerta-card{background:#3A2224}}
.alerta-card .av{background:#fff}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:999px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>

    <h1>¡Hola! 👋</h1>
    <p class="muted">Cuéntanos cómo te llamas.</p>
    <label for="rNom">Tu nombre</label><input id="rNom" type="text" autocomplete="name" value="${esc(temp.nombre)}" placeholder="Ej. Andrés Leal">
    ${temp.metodo==="Correo"?`<label for="rCor">Tu correo</label><input id="rCor" type="email" autocomplete="email" value="${esc(temp.correo)}" placeholder="tucorreo@ejemplo.com">`:`<p class="aviso">En la versión final, tu nombre y correo vendrán de tu cuenta de ${temp.metodo} automáticamente.</p>`}
    <div style="margin-top:22px"><button class="btn azul" onclick="paso2()">Siguiente</button></div>
  </div>`;
  return `<div class="paso">
    <div class="puntos"><i class="on"></i><i class="on"></i></div>
    <h1>¿En qué municipio vives?</h1>
    <p class="muted">Así te avisamos si se pierde una mascota cerca de ti y te mostramos lo que hay en tu zona.</p>
    <div class="lista-mun">${MUNICIPIOS.map(m=>`<button class="${temp.municipio===m?"on":""}" onclick="elegirMun('${m}')">${m}</button>`).join("")}</div>
    <label for="rCol">Tu colonia <small>(opcional)</small></label><input id="rCol" type="text" value="${esc(temp.colonia)}" placeholder="Ej. Del Valle">
    <div class="interruptor" style="margin-top:14px"><span>🔔 Avisarme si se pierde una mascota en mi zona</span><input type="checkbox" id="rAl" ${temp.alertas?"checked":""}></div>
    <div style="margin-top:22px"><button class="btn azul" onclick="terminarRegistro()">Listo, entrar</button>
    <button class="btn claro" onclick="temp.paso=1;render()">Atrás</button></div>
  </div>`;
}
function paso2(){
  temp.nombre = $("#rNom").value.trim(); if($("#rCor")) temp.correo = $("#rCor").value.trim();
  if(!temp.nombre) return toast("Escribe tu nombre");
  temp.paso = 2; render();
}
function elegirMun(m){ temp.colonia = $("#rCol").value; temp.alertas = $("#rAl").checked; temp.municipio = m; render(); }
function terminarRegistro(){
  temp.colonia = $("#rCol").value.trim(); temp.alertas = $("#rAl").checked;
  if(!temp.municipio) return toast("Elige tu municipio");
  S.usuario = {nombre:temp.nombre, correo:temp.correo, metodo:temp.metodo, municipio:temp.municipio, colonia:temp.colonia, alertas:temp.alertas, desde:new Date().toISOString()};
  guardar(); vista="inicio"; sub=null; render(); toast("¡Bienvenido a PetMTY! 🐾");
}

/* ---------- Inicio ---------- */
function vInicio(){
  const u=S.usuario, primer=u.nombre.split(" ")[0];
  const cerca=ALERTAS_DEMO.filter(a=>a.municipio===u.municipio);
  return `<div class="hola"><h2>Hola, ${esc(primer)} 👋</h2><p>¿A dónde vamos hoy?</p></div>
  <div class="tarjeta" style="background:var(--azul);color:#fff">
    <h2 style="color:#fff">🚐 Pide un traslado</h2>
    <p style="margin:0 0 14px">Cómodo, seguro y con mucho amor. Te cotizamos por WhatsApp en minutos.</p>
    <button class="btn prim" onclick="ir('pedir')">Pedir traslado</button>
  </div>
  <div class="rapidos">
    <button class="rapido" onclick="emergencia()"><span class="em">🚨</span><b>Emergencia</b><span>Llévalo rápido al vet</span></button>
    <button class="rapido" onclick="bodas()"><span class="em">💍</span><b>Bodas</b><span>Tu perro en tu boda</span></button>
  </div>
  <div class="tarjeta">
    <h2>🔔 Alertas cerca de ti</h2>
    ${cerca.length?cerca.map(tarjetaAlerta).join(""):`<p class="muted" style="margin:0">No hay mascotas perdidas en ${esc(u.municipio)} por ahora. 💙</p>`}
    <button class="btn claro" style="margin-top:6px" onclick="ir('alertas')">Ver todas las alertas</button>
  </div>
  <div class="tarjeta">
    <h2>🐾 Tus mascotas</h2>
    ${S.mascotas.length?S.mascotas.map(filaMascota).join(""):`<p class="muted" style="margin:0 0 10px">Registra a tu mascota para pedir traslados en 3 toques.</p>`}
    <button class="btn claro" style="margin-top:8px" onclick="ir('mascotas');editarMascota(-1)">+ Agregar mascota</button>
  </div>`;
}
function tarjetaAlerta(a){
  return `<div class="alerta-card"><div class="av">${emo(a.tipo)}</div><div class="txt" style="flex:1"><b>Se perdió ${esc(a.nombre)}</b><span class="muted" style="display:block;font-size:.9rem">${esc(a.colonia)}, ${esc(a.municipio)} · ${esc(a.cuando)}</span><span style="font-size:.9rem">${esc(a.desc)}</span></div></div>`;
}
function emergencia(){
  const u=S.usuario;
  location.href = wa(`🚨 *URGENTE* · Necesito un traslado de emergencia para mi mascota.\n👤 ${u.nombre}\n📍 ${u.colonia?u.colonia+", ":""}${u.municipio}`);
}
function bodas(){ location.href = wa("💍 Hola, me voy a casar y quiero información sobre el servicio de mascotas en bodas 🐶"); }

/* ---------- Mascotas ---------- */
function filaMascota(m,i){
  return `<div class="fila" onclick="ir('mascotas');editarMascota(${i})" style="cursor:pointer"><div class="av">${m.foto?`<img src="${m.foto}" alt="">`:emo(m.tipo)}</div>
   <div class="txt"><b>${esc(m.nombre)}</b><span>${m.tipo==="gato"?"Gato":"Perro"} · ${esc(m.tamano||"")}${m.pelo?" · pelo "+esc(m.pelo):""}</span></div><span class="muted">›</span></div>`;
}
function vMascotas(){
  if(sub!==null) return formMascota();
  return `<div class="tarjeta">
    ${S.mascotas.length?S.mascotas.map(filaMascota).join(""):`<div class="vacio"><div class="em">🐶🐱</div><p>Todavía no tienes mascotas registradas.</p></div>`}
    <button class="btn prim" style="margin-top:12px" onclick="editarMascota(-1)">+ Agregar mascota</button>
  </div>`;
}
function editarMascota(i){
  sub=i; const m=i>=0?S.mascotas[i]:{};
  temp={nombre:m.nombre||"",tipo:m.tipo||"perro",tamano:m.tamano||"",pelo:m.pelo||"",caracter:m.caracter||"",vacunas:m.vacunas||"",notas:m.notas||"",foto:m.foto||""};
  render();
}
function opc(campo,vals){ return `<div class="opciones">${vals.map(v=>`<button type="button" class="${temp[campo]===v?"on":""}" onclick="leerForm();temp['${campo}']='${v}';render()">${v}</button>`).join("")}</div>`; }
function formMascota(){
  return `<div class="tarjeta">
    <div class="foto-sel"><div class="av">${temp.foto?`<img src="${temp.foto}" alt="">`:emo(temp.tipo)}</div>
      <div><button class="btn claro" style="padding:10px 16px;width:auto" onclick="$('#fFoto').click()">📷 ${temp.foto?"Cambiar foto":"Agregar foto"}</button>
      <input id="fFoto" type="file" accept="image/*" style="display:none" onchange="cargarFoto(this)"></div></div>
    <label for="fNom">Nombre</label><input id="fNom" type="text" value="${esc(temp.nombre)}" placeholder="Ej. Max">
    <label>Es un…</label>${opc("tipo",["perro","gato"])}
    <label>Tamaño</label>${opc("tamano",["chico","mediano","grande","gigante"])}
    <label>Pelo</label>${opc("pelo",["corto","largo"])}
    <label for="fCar">Carácter <small>(se marea, es nervioso, muerde…)</small></label><input id="fCar" type="text" value="${esc(temp.caracter)}">
    <label for="fVac">Última vacuna <small>(opcional)</small></label><input id="fVac" type="date" value="${esc(temp.vacunas)}">
    <label for="fNot">Notas <small>(medicamentos, alergias…)</small></label><textarea id="fNot">${esc(temp.notas)}</textarea>
    <div style="margin-top:20px"><button class="btn prim" onclick="guardarMascota()">Guardar</button>
    ${sub>=0?`<button class="btn peligro" onclick="borrarMascota()">Quitar mascota</button>`:""}</div>
  </div>`;
}
function leerForm(){ if(!$("#fNom"))return; temp.nombre=$("#fNom").value; temp.caracter=$("#fCar").value; temp.vacunas=$("#fVac").value; temp.notas=$("#fNot").value; }
function cargarFoto(inp){
  const f=inp.files[0]; if(!f)return; leerForm();
  const img=new Image(); img.onload=()=>{ const s=420, c=document.createElement("canvas"), k=Math.min(1,s/Math.max(img.width,img.height));
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    temp.foto=c.toDataURL("image/jpeg",.8); URL.revokeObjectURL(img.src); render(); };
  img.src=URL.createObjectURL(f);
}
function guardarMascota(){
  leerForm(); if(!temp.nombre.trim()) return toast("Escribe su nombre");
  if(!temp.tamano) return toast("Elige su tamaño");
  const m={nombre:temp.nombre.trim(),tipo:temp.tipo,tamano:temp.tamano,pelo:temp.pelo,caracter:temp.caracter.trim(),vacunas:temp.vacunas,notas:temp.notas.trim(),foto:temp.foto};
  if(sub>=0) S.mascotas[sub]=m; else S.mascotas.push(m);
  guardar(); sub=null; render(); toast(m.nombre+" quedó guardado "+emo(m.tipo));
}
function borrarMascota(){ if(!confirm("¿Quitar a "+S.mascotas[sub].nombre+"?"))return; S.mascotas.splice(sub,1); guardar(); sub=null; render(); }

/* ---------- Pedir traslado ---------- */
function vPedir(){
  if(!S.mascotas.length) return `<div class="tarjeta"><div class="vacio"><div class="em">🐾</div><p>Primero registra a tu mascota para que sepamos a quién llevamos.</p></div>
    <button class="btn prim" onclick="ir('mascotas');editarMascota(-1)">+ Agregar mascota</button></div>`;
  if(temp.pedido===undefined){ const u=S.usuario; temp={pedido:true,mascotas:[0],viaje:"Sencillo",origen:(u.colonia?u.colonia+", ":"")+u.municipio,destino:"",fecha:"",notas:""}; }
  return `<div class="tarjeta">
    <label style="margin-top:0">¿Quién viaja?</label>
    <div class="opciones">${S.mascotas.map((m,i)=>`<button type="button" class="${temp.mascotas.includes(i)?"on":""}" onclick="leerPedido();togMascota(${i})">${emo(m.tipo)} ${esc(m.nombre)}</button>`).join("")}</div>
    <label>Tipo de viaje</label>
    <div class="opciones">${["Sencillo","Redondo","Con espera"].map(v=>`<button type="button" class="${temp.viaje===v?"on":""}" onclick="leerPedido();temp.viaje='${v}';render()">${v}</button>`).join("")}</div>
    <label for="pOri">¿Dónde lo recogemos?</label><input id="pOri" type="text" value="${esc(temp.origen)}" placeholder="Dirección o colonia">
    <label for="pDes">¿A dónde va?</label><input id="pDes" type="text" value="${esc(temp.destino)}" placeholder="Ej. Estética Huellitas, San Pedro">
    <label for="pFec">Día y hora</label><input id="pFec" type="datetime-local" value="${esc(temp.fecha)}">
    <label for="pNot">Notas <small>(opcional)</small></label><textarea id="pNot" placeholder="Algo que debamos saber">${esc(temp.notas)}</textarea>
    <div style="margin-top:20px"><button class="btn wa" onclick="enviarPedido()">${ICO.wa} Cotizar por WhatsApp</button></div>
    <p class="muted" style="text-align:center;font-size:.9rem;margin:12px 0 0">Te llega a WhatsApp con todos los datos para cotizarte rápido.</p>
  </div>
  ${S.viajes.length?`<div class="tarjeta"><h2>🕑 Tus solicitudes</h2>${S.viajes.slice(-5).reverse().map(v=>`<div class="fila"><div class="av">🚐</div><div class="txt"><b>${esc(v.mascotas)}</b><span>${esc(v.destino)} · ${esc(v.cuando)}</span></div></div>`).join("")}</div>`:""}`;
}
function leerPedido(){ if(!$("#pOri"))return; temp.origen=$("#pOri").value; temp.destino=$("#pDes").value; temp.fecha=$("#pFec").value; temp.notas=$("#pNot").value; }
function togMascota(i){ const k=temp.mascotas.indexOf(i); if(k>=0){ if(temp.mascotas.length>1) temp.mascotas.splice(k,1); } else temp.mascotas.push(i); render(); }
function fechaBonita(v){ if(!v) return "Por definir"; const d=new Date(v); return d.toLocaleString("es-MX",{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"}); }
function enviarPedido(){
  leerPedido(); if(!temp.destino.trim()) return toast("Escribe a dónde va");
  if(!temp.origen.trim()) return toast("Escribe dónde lo recogemos");
  const u=S.usuario, ms=temp.mascotas.map(i=>S.mascotas[i]);
  let t=`🐾 *Solicitud de traslado PetMTY*\n👤 ${u.nombre}\n`;
  ms.forEach(m=>{ t+=`${emo(m.tipo)} ${m.nombre} · ${m.tipo==="gato"?"gato":"perro"} ${m.tamano}${m.pelo?", pelo "+m.pelo:""}\n`; if(m.caracter) t+=`   📝 ${m.caracter}\n`; if(m.notas) t+=`   💊 ${m.notas}\n`; });
  t+=`📍 Origen: ${temp.origen.trim()}\n📍 Destino: ${temp.destino.trim()}\n📅 ${fechaBonita(temp.fecha)}\n🔁 Viaje: ${temp.viaje}`;
  if(temp.notas.trim()) t+=`\n🗒️ ${temp.notas.trim()}`;
  S.viajes.push({mascotas:ms.map(m=>m.nombre).join(", "),destino:temp.destino.trim(),cuando:temp.fecha?new Date(temp.fecha).toLocaleDateString("es-MX",{day:"numeric",month:"short"}):"Por definir"});
  guardar(); temp={}; location.href=wa(t);
}

/* ---------- Alertas ---------- */
function vAlertas(){
  const u=S.usuario, mias=ALERTAS_DEMO.filter(a=>a.municipio===u.municipio), otras=ALERTAS_DEMO.filter(a=>a.municipio!==u.municipio);
  return `<div class="tarjeta" style="background:#FFF1F1">
    <h2>¿Se perdió tu mascota?</h2>
    <p style="margin:0 0 12px">Avisamos a las personas de tu zona para ayudarte a encontrarla.</p>
    <button class="btn azul" onclick="reportar()">Reportar mascota perdida</button>
  </div>
  <div class="tarjeta"><h2>📍 En ${esc(u.municipio)}</h2>${mias.length?mias.map(tarjetaAlerta).join(""):`<p class="muted" style="margin:0">Ninguna por ahora. 💙</p>`}</div>
  ${otras.length?`<div class="tarjeta"><h2>Otras zonas</h2>${otras.map(tarjetaAlerta).join("")}</div>`:""}
  <p class="muted" style="text-align:center;font-size:.88rem">Estas alertas son de ejemplo para la versión de prueba.</p>`;
}
function reportar(){
  const u=S.usuario, m=S.mascotas[0];
  location.href=wa(`🔔 *Reporte de mascota perdida*\n👤 ${u.nombre}\n${m?emo(m.tipo)+" "+m.nombre+" · "+(m.tipo==="gato"?"gato":"perro")+" "+m.tamano:"Mascota: "}\n📍 Se perdió en: ${u.colonia?u.colonia+", ":""}${u.municipio}\n🕑 Cuándo: \n📝 Cómo es: \n(Te envío su foto)`);
}

/* ---------- Tienda ---------- */
function vTienda(){
  if(!PRODUCTOS.length) return `<div class="tarjeta"><div class="vacio"><div class="em">🛒</div><b style="display:block;font-size:1.3rem;color:var(--texto)">¡Muy pronto!</b><p>Estamos preparando productos para que tu mascota viaje cómoda y segura.</p></div>
    <a class="btn wa" href="${wa("Hola, quiero información sobre la tiendita de PetMTY 🛒")}">${ICO.wa} Pregúntanos por WhatsApp</a></div>`;
  return `<div class="tarjeta">${PRODUCTOS.map(p=>`<div class="fila"><div class="av"><img src="${esc(p.foto)}" alt=""></div><div class="txt"><b>${esc(p.nombre)}</b><span>${esc(p.precio)}</span></div><a class="chip" href="${wa("Hola, quiero comprar: "+p.nombre+" 🛒")}">Lo quiero</a></div>`).join("")}</div>`;
}

/* ---------- Perfil ---------- */
function vPerfil(){
  const u=S.usuario;
  return `<div class="tarjeta" style="text-align:center">
    <div class="av" style="width:80px;height:80px;margin:0 auto 8px;font-size:2.4rem">🙂</div>
    <b style="font-size:1.3rem">${esc(u.nombre)}</b><p class="muted" style="margin:2px 0 0">${esc(u.correo||"Cuenta de "+u.metodo)}</p>
  </div>
  <div class="tarjeta">
    <label for="peMun" style="margin-top:0">Municipio</label>
    <select id="peMun" onchange="S.usuario.municipio=this.value;guardar();toast('Municipio actualizado')">${MUNICIPIOS.map(m=>`<option ${m===u.municipio?"selected":""}>${m}</option>`).join("")}</select>
    <label for="peCol">Colonia</label><input id="peCol" type="text" value="${esc(u.colonia)}" onchange="S.usuario.colonia=this.value.trim();guardar();toast('Colonia actualizada')">
    <div class="interruptor" style="margin-top:14px"><span>🔔 Alertas de mascotas perdidas en mi zona</span><input type="checkbox" ${u.alertas?"checked":""} onchange="S.usuario.alertas=this.checked;guardar()"></div>
  </div>
  <div class="tarjeta">
    <a class="btn claro" href="${wa("Hola, tengo una duda sobre la app de PetMTY")}">${ICO.wa} Ayuda por WhatsApp</a>
    <button class="btn peligro" onclick="borrarCuenta()">Borrar mi cuenta</button>
  </div>
  <p class="muted" style="text-align:center;font-size:.85rem">PetMTY · versión de prueba 0.3</p>`;
}
function borrarCuenta(){ if(!confirm("Se borrarán tu cuenta y tus mascotas de este celular. ¿Seguro?"))return; S={usuario:null,mascotas:[],viajes:[]}; guardar(); temp={}; render(); }

/* ---------- Navegación ---------- */
const TITULOS={inicio:"PetMTY",mascotas:"Mis mascotas",pedir:"Pedir traslado",tienda:"Tiendita",alertas:"Alertas",perfil:"Mi perfil"};
function ir(v){ vista=v; sub=null; temp={}; render(); window.scrollTo(0,0); }
function render(){
  const r=$("#raiz");
  if(!S.usuario){ r.innerHTML = temp.paso ? pantallaRegistro() : pantallaBienvenida(); return; }
  const cuerpo={inicio:vInicio,mascotas:vMascotas,pedir:vPedir,tienda:vTienda,alertas:vAlertas,perfil:vPerfil}[vista]();
  const atras = (vista==="mascotas"&&sub!==null) ? `<button class="atras" aria-label="Atrás" onclick="sub=null;temp={};render()">‹</button>` : (vista==="alertas"?`<button class="atras" aria-label="Atrás" onclick="ir('inicio')">‹</button>`:"");
  const tit = vista==="mascotas"&&sub!==null ? (sub>=0?"Editar mascota":"Nueva mascota") : TITULOS[vista];
  const nb=(v,ic,t)=>`<button class="${vista===v?"on":""}" onclick="ir('${v}')" aria-label="${t}">${ICO[ic]}<span>${t}</span></button>`;
  r.innerHTML = `<div class="app">
    <header class="cab">${atras||`<img src="${PERRO}" alt="">`}<h1>${tit}</h1></header>
    <main>${cuerpo}</main>
    <nav class="nav">
      ${nb("inicio","casa","Inicio")}${nb("mascotas","huella","Mascotas")}
      <button class="centro" onclick="ir('pedir')" aria-label="Pedir traslado"><span class="bola"><img src="${CARRO}" alt=""></span><small>Pedir</small></button>
      ${nb("tienda","bolsa","Tienda")}${nb("perfil","yo","Perfil")}
    </nav></div>`;
}
render();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
